# docker-compose.yml -- Local development infrastructure
# DO NOT put real secrets here. Use .env file (see .env.example).
# DO NOT run docker compose up on Windows without Docker Desktop installed.

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agtech}
      POSTGRES_USER: ${POSTGRES_USER:-agtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agtech}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config:/mosquitto/config
    ports:
      - "${MQTT_PORT:-1883}:1883"

  api-gateway:
    build:
      context: .
      dockerfile: backend/api_gateway/Dockerfile
    env_file: .env
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000

  ai-serving:
    build:
      context: .
      dockerfile: backend/ai_serving/Dockerfile
    env_file: .env
    depends_on:
      - minio
    command: uvicorn ai_serving.main:app --host 0.0.0.0 --port 8001

  decision-engine:
    build:
      context: .
      dockerfile: backend/decision_engine/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn decision_engine.main:app --host 0.0.0.0 --port 8002

  ingestion-service:
    build:
      context: .
      dockerfile: backend/ingestion_service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn ingestion_service.main:app --host 0.0.0.0 --port 8003

volumes:
  pg_data:
  minio_data:
